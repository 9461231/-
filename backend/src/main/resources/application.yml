server:
  port: 8080

spring:
  application:
    name: supermarket-backend
  datasource:
    url: jdbc:mysql://localhost:3306/supermarket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: your-mysql-username
    password: "your-mysql-password"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
    com.muxu.supermarket: debug
  file:
    name: logs/supermarket-backend.log
